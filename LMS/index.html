<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login | EduConnect LMS</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <style>
  body {
    margin: 0;
    padding: 0;
    background: url('pics/campus.jpg') no-repeat center center fixed;
    background-size: cover;
  }
</style>

</head>
<body class="bg-gray-100 flex items-center justify-center h-screen"> 
  <div class="bg-white p-8 rounded-lg shadow-lg w-96">
    <h1 class="text-2xl font-bold mb-6 text-center text-blue-700">PLMUN LMS</h1>
    <form action="dashboard.html" method="GET">
      <input type="email" placeholder="Email" class="w-full p-3 mb-3 border rounded-lg" required>
      <input type="password" placeholder="Password" class="w-full p-3 mb-3 border rounded-lg" required>
      <button class="bg-blue-600 w-full py-3 text-white rounded-lg hover:bg-blue-700">Login</button>
    </form>
    <p class="text-sm text-center mt-4">Don’t have an account? <a href="#" class="text-blue-600 hover:underline">Sign up</a></p>
  </div>
  
</body>
</html>
